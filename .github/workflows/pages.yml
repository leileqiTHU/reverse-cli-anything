name: Documentation site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'acceptance/*.md'
      - '*-cli/README.md'
      - 'site/**'
      - 'tools/build-site.py'
      - 'tools/check-site.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r site/requirements.txt
      - uses: actions/configure-pages@v5
        id: pages
      - run: python tools/build-site.py --base-url "$SITE_URL"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: python tools/check-site.py --base-url "$SITE_URL"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
